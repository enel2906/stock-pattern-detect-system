  <!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <link rel="icon" href="data:;base64,iVBORw0KGgo=">
  <!-- Include the Lightweight Charts library -->
  <script src="https://unpkg.com/lightweight-charts@4.2.0/dist/lightweight-charts.standalone.production.js"></script>
  <!-- Include Pattern Definitions -->

  <style>
    :root {
      --bg:#0b0d10; --panel:#12151a; --text:#dce3ea; --muted:#8b95a5; --accent:#3b82f6; --grid:#1f242d;
    }
    body.light {
      --bg:#ffffff; --panel:#f4f6f8; --text:#1f2937; --muted:#6b7280; --accent:#2563eb; --grid:#e5e7eb;
    }
    * { box-sizing: border-box; }
    body { 
      margin:0; 
      font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial; 
      background: var(--bg); 
      color: var(--text); 
    }
    header { 
      display:flex; 
      align-items:center; 
      justify-content:space-between; 
      padding:12px 16px; 
      background: var(--panel); 
      border-bottom:1px solid #1a1f27; 
      position: sticky; 
      top:0; 
      z-index:5;
      flex-wrap: wrap;
      gap: 12px;
    }
    .brand { 
      display:flex; 
      align-items:center; 
      gap:10px; 
      font-weight:700; 
      letter-spacing:.2px; 
    }
    .brand .dot { 
      width:10px; 
      height:10px; 
      border-radius:50%; 
      background: var(--accent); 
      box-shadow: 0 0 12px var(--accent); 
    }
    .controls { 
      display:flex; 
      gap:8px; 
      align-items:center; 
      flex-wrap: wrap; 
    }
    .controls input, .controls select, .controls button {
      background:#0f1117; 
      color:var(--text); 
      border:1px solid #2a313d; 
      padding:8px 10px; 
      border-radius:10px; 
      outline:none;
      font-size: 13px;
    }
    .controls input:focus, .controls select:focus { border-color: var(--accent); }
    .controls button { cursor: pointer; font-weight:600; }
    .controls button.primary { background: var(--accent); border-color:transparent; color:white; }
    
    .layout {
      display:grid;
      grid-template-rows: 100%;
      gap:0;
      padding:10px;
      height: var(--layout-h, 80vh);
    }

    .chart {
      height: auto;
      min-height: 0;
      position: relative;
    }

    .card {
      background: var(--panel);
      border:1px solid #1a1f27;
      border-radius:14px;
      box-shadow: 0 10px 30px rgba(0,0,0,.25);
      overflow: hidden;
    }
    
    .status { font-size:12px; color: var(--muted); margin-left: 16px; }
    .row { display:flex; gap:8px; align-items:center; }
    .spacer { flex:1; }

    /* Pattern category colors for optgroups */
    optgroup {
      font-weight: bold;
      background: linear-gradient(135deg, #f5f8ff 0%, #e8f2ff 100%);
      color: #003366;
      border-bottom: 2px solid #0066CC;
      padding: 8px 0;
      font-size: 14px;
    }

    optgroup option {
      font-weight: normal;
      background-color: #fff;
      color: #333;
      padding: 8px 15px;
      border-left: 3px solid transparent;
      transition: all 0.3s ease;
    }

    optgroup[label*="Single"] {
      background: linear-gradient(135deg, #fff8e1 0%, #ffecb3 100%);
      border-left: 4px solid #ff9800;
    }
    
    optgroup[label*="Two"] {
      background: linear-gradient(135deg, #f3e5f5 0%, #e1bee7 100%);
      border-left: 4px solid #9c27b0;
    }
    
    optgroup[label*="Three"] {
      background: linear-gradient(135deg, #e8f5e8 0%, #c8e6c9 100%);
      border-left: 4px solid #4caf50;
    }
    
    optgroup[label*="Multi"] {
      background: linear-gradient(135deg, #e3f2fd 0%, #bbdefb 100%);
      border-left: 4px solid #2196f3;
    }
    
    optgroup[label*="Complex"] {
      background: linear-gradient(135deg, #fce4ec 0%, #f8bbd9 100%);
      border-left: 4px solid #e91e63;
    }

    /* Hide watermarks */
    #tvchart a[href*="tradingview"], #tvchart [class*="tradingview"],
    #tvchart [class*="watermark"] { display:none !important; }

    /* Pattern indicator tooltip styles */
    .pattern-tooltip {
      position: absolute;
      background: rgba(18, 21, 26, 0.98);
      border: 1px solid #3b82f6;
      border-radius: 8px;
      padding: 12px 16px;
      color: var(--text);
      font-size: 13px;
      line-height: 1.6;
      max-width: 350px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.4);
      z-index: 9999;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.2s ease;
      word-wrap: break-word;
    }

    body.light .pattern-tooltip {
      background: rgba(255, 255, 255, 0.98);
      border-color: #2563eb;
      box-shadow: 0 8px 24px rgba(0,0,0,0.15);
    }

    .pattern-tooltip.visible {
      opacity: 1;
    }

    .pattern-tooltip-title {
      font-weight: 700;
      font-size: 14px;
      margin-bottom: 8px;
      color: #3b82f6;
      border-bottom: 1px solid rgba(59, 130, 246, 0.3);
      padding-bottom: 6px;
    }

    body.light .pattern-tooltip-title {
      color: #2563eb;
      border-bottom-color: rgba(37, 99, 235, 0.3);
    }

    .pattern-tooltip-content {
      color: var(--text);
      font-size: 13px;
    }

    /* Pattern indicator label on chart */
    .pattern-label {
      position: absolute;
      background: rgba(59, 130, 246, 0.9);
      color: white;
      padding: 4px 8px;
      border-radius: 4px;
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
      user-select: none;
      transition: transform 0.2s ease;
    }

    .pattern-label:hover {
      transform: scale(1.1);
      background: rgba(59, 130, 246, 1);
    }

    .pattern-label.bullish {
      background: rgba(38, 166, 154, 0.9);
    }

    .pattern-label.bearish {
      background: rgba(239, 83, 80, 0.9);
    }

    @media (max-width: 720px) {
      .chart { height: 80vh; }
      .controls { gap:6px; }
      header { flex-direction: column; align-items: flex-start; }
      .pattern-tooltip {
        max-width: 280px;
        font-size: 12px;
      }
    }
  </style>
</head>

  <script>
    const $ = (s) => document.querySelector(s);
    const statusEl = $('#status');
    const RIGHT_OFFSET = 20;

    // Pattern definitions - loaded from pattern-definitions.js
    const patternDefinitions = PATTERN_DEFINITIONS;

    // Create tooltip element
    const tooltip = document.createElement('div');
    tooltip.className = 'pattern-tooltip';
    document.body.appendChild(tooltip);

    // Function to show tooltip with pattern definition
    function showPatternTooltip(patternType, patternName, x, y) {
      const definition = patternDefinitions[patternType];
      if (!definition) {
        return;
      }

      tooltip.innerHTML = `
        <div class="pattern-tooltip-title">${patternName}</div>
        <div class="pattern-tooltip-content">${definition}</div>
      `;

      // Position tooltip
      const tooltipRect = tooltip.getBoundingClientRect();
      let left = x + 10;
      let top = y + 10;

      // Adjust if tooltip goes off screen
      if (left + tooltipRect.width > window.innerWidth) {
        left = x - tooltipRect.width - 10;
      }
      if (top + tooltipRect.height > window.innerHeight) {
        top = window.innerHeight - tooltipRect.height - 10;
      }

      tooltip.style.left = left + 'px';
      tooltip.style.top = top + 'px';
      tooltip.classList.add('visible');
    }

    // Function to hide tooltip
    function hidePatternTooltip() {
      tooltip.classList.remove('visible');
    }

    // Get pattern abbreviation for display
    function getPatternAbbreviation(patternName) {
      const abbrevMap = {
        'bullish_engulfing': 'BE',
        'bearish_engulfing': 'BE',
        'hammer': 'HM',
        'hanging_man': 'HM',
        'shooting_star': 'SS',
        'inverted_hammer': 'IH',
        'morning_star': 'MS',
        'evening_star': 'ES',
        'three_white_soldiers': '3WS',
        'three_black_crows': '3BC',
        'piercing_line': 'PL',
        'dark_cloud_cover': 'DCC',
        'harami': 'HR',
        'tweezer_top': 'TT',
        'tweezer_bottom': 'TB',
        'doji': 'DJ',
        'dragonfly_doji': 'DDJ',
        'gravestone_doji': 'GDJ',
        'long_legged_doji': 'LDJ',
        'marubozu': 'MZ',
        'bullish_marubozu': 'BMZ',
        'bearish_marubozu': 'BMZ',
        'cup_with_handle': 'CWH',
        'head_and_shoulders': 'H&S',
        'inverse_head_and_shoulders': 'IH&S',
        'double_tops': 'DT',
        'double_bottoms': 'DB',
        'flag_pattern': 'FLG',
        'pennant': 'PEN',
        'triangle_ascending': 'AT',
        'triangle_descending': 'DT',
        'triangle_symmetrical': 'ST'
      };
      return abbrevMap[patternName] || patternName.substring(0, 3).toUpperCase();
    }

    // Determine if pattern is bullish or bearish for styling
    function getPatternSentiment(patternName) {
      const bullishPatterns = [
        'bullish_engulfing', 'hammer', 'inverted_hammer', 'morning_star', 
        'three_white_soldiers', 'piercing_line', 'dragonfly_doji', 'bullish_marubozu',
        'bullish_belt_hold', 'bullish_kicker', 'bullish_harami_cross', 'bullish_counterattack',
        'tweezer_bottom', 'morning_star_doji', 'three_outside_up', 'three_inside_up',
        'upside_tasuki_gap', 'bullish_tri_star', 'rising_three', 'bullish_three_line_strike',
        'cup_with_handle', 'double_bottoms', 'inverse_head_and_shoulders', 'triangle_ascending'
      ];
      
      const bearishPatterns = [
        'bearish_engulfing', 'hanging_man', 'shooting_star', 'evening_star',
        'three_black_crows', 'dark_cloud_cover', 'gravestone_doji', 'bearish_marubozu',
        'bearish_belt_hold', 'bearish_kicker', 'bearish_harami_cross', 'bearish_counterattack',
        'tweezer_top', 'evening_star_doji', 'bearish_abandoned_baby', 'downside_tasuki_gap',
        'bearish_tri_star', 'falling_three', 'bearish_three_line_strike', 'ladder_top',
        'double_tops', 'head_and_shoulders', 'triangle_descending'
      ];

      if (bullishPatterns.includes(patternName)) return 'bullish';
      if (bearishPatterns.includes(patternName)) return 'bearish';
      return 'neutral';
    }

    function setStatus(t){ statusEl.textContent = t; }

    // Tính chiều cao thực tế cho .layout để lấp đầy màn hình
    function sizeLayout() {
      const h = window.innerHeight;
      const headerH = document.querySelector('header')?.offsetHeight || 0;
      const layoutH = h - headerH - 20;
      document.querySelector('.layout').style.setProperty('--layout-h', layoutH + 'px');
    }

    window.addEventListener('resize', sizeLayout);
    sizeLayout();

    // Theme toggle
    const themeBtn = $('#toggle-theme');
    let isLight = false;

    themeBtn.addEventListener('click', () => {
      isLight = !isLight;
      document.body.classList.toggle('light', isLight);
      themeBtn.textContent = isLight ? '☀️' : '🌙';

      // Đổi màu chart khi đổi theme
      const colors = isLight
        ? { bg:'transparent', text:'#1f2937', grid:'#e5e7eb', border:'#2a313d' }
        : { bg:'transparent', text:'#c7d2e0', grid:'#1f242d', border:'#2b3240' };

      if (chart) {
        chart.applyOptions({
          layout: { background:{ type:'solid', color: colors.bg }, textColor: colors.text },
          grid: { vertLines:{ color: colors.grid }, horzLines:{ color: colors.grid } },
          rightPriceScale: { borderColor: colors.border },
          timeScale: { borderColor: colors.border }
        });
      }
    });

    const checkSelectedPattern = async () => {
        try {
          const selectedPattern = document.getElementById("patternSelector").value;
          
          if (!selectedPattern) {
            console.warn('No pattern selected');
            return;
          }

          // Call the appropriate function based on the selected pattern
          switch (selectedPattern) {
          // One candle patterns
          case "hammer":
            await getPattern("hammer", "Hammer");
            break;
          case "long_legged_doji":
            await getPattern("long_legged_doji", "Long Legged Doji");
            break;
          case "gravestone_doji":
            await getPattern("gravestone_doji", "Gravestone Doji");
            break;
          case "dragonfly_doji":
            await getPattern("dragonfly_doji", "Dragonfly Doji");
            break;
          case "inverted_hammer": 
            await getPattern("inverted_hammer", "Inverted Hammer");
            break;
          case "hanging_man":
            await getPattern("hanging_man", "Hanging Man");
            break;
          case "shooting_star":
            await getPattern("shooting_star", "Shooting Star");
            break;
          case "bearish_marubozu":
            await getPattern("bearish_marubozu", "Bearish Marubozu");
            break;
          case "bullish_marubozu":
            await getPattern("bullish_marubozu", "Bullish Marubozu");
            break;
          case "bearish_belt_hold":
            await getPattern("bearish_belt_hold", "Bearish Belt Hold");
            break;
          case "bullish_belt_hold":
            await getPattern("bullish_belt_hold", "Bullish Belt Hold");
            break;

          // Two candle patterns
          case "bullish_engulfing":
            await getPattern("bullish_engulfing", "Bullish Engulfing");
            break;
          case "bearish_engulfing":
            await getPattern("bearish_engulfing", "Bearish Engulfing");
            break;

      const getPattern = async (patternName, patternTitle) => {

      // Setup tooltip listeners for markers
      function setupMarkerTooltips(patterns, patternName, patternTitle) {
        // Subscribe to crosshair move to detect hover over markers
        chart.subscribeCrosshairMove((param) => {
          if (!param || !param.time || !param.point) {
            hidePatternTooltip();
            return;
          }

          // Check if crosshair is over a pattern marker
          // For complex patterns, check candleIndex property, for simple patterns check time
          const hoveredPattern = patterns.find(p => {
            if (p.candleIndex !== undefined && p.candleIndex >= 0 && p.candleIndex < originalData.length) {
              return originalData[p.candleIndex].time === param.time;
            }
            return p.time === param.time;
          });
          
          if (hoveredPattern) {
            showPatternTooltip(patternName, patternTitle, param.point.x, param.point.y);
          } else {
            hidePatternTooltip();
          }
        });
      }

      const findPattern = async (pattern) => {
        try {
          const stockSymbol = document.getElementById('stockSelector').value || "AAPL";

          const response = await res.json();

            throw new Error('Invalid data format');

      // New function to handle complex patterns with pivot points
      const getComplexPattern = async (patternName, patternTitle) => {
        try {
          setStatus(`Đang tìm mô hình ${patternTitle}...`);
          
          if (!candleseries) {
            console.error('Candleseries is not initialized.');
            setStatus('Lỗi: Biểu đồ chưa được khởi tạo.');
            return;
          }

          // Reset patterns trước khi vẽ pattern mới (không await)
          resetPatterns();
          
          // Đảm bảo dữ liệu gốc vẫn còn nguyên vẹn
          if (!originalData || originalData.length === 0) {
            console.error('Original data is missing or empty');
            setStatus('Lỗi: Không có dữ liệu.');
            return;
          }

          const stockSymbol = document.getElementById('stockSelector').value;
          const res = await fetch(`http://localhost:60/alert/candle-stick/${stockSymbol}?candlePattern=${patternName}`);
          
          if (!res.ok) {
            throw new Error('Failed to fetch pattern data');
          }

          const response = await res.json();
          if (response.code !== 0 || !response.data) {
            console.log('No patterns found for ' + patternTitle);
            setStatus(`Không tìm thấy mô hình ${patternTitle}.`);
            return;
          }

          const patterns = response.data;
          const allMarkers = [];
          const allLines = [];
          
          // Get pattern info for tooltips

          const sentiment = getPatternSentiment(patternName);

          console.log(`Processing ${patterns.length} ${patternTitle} pattern(s)`);
          setStatus(`Đang xử lý ${patterns.length} mô hình ${patternTitle}...`);

          patterns.forEach((pattern, patternIndex) => {
            console.log(`Processing pattern ${patternIndex + 1}:`, pattern);
            // Xử lý cho Double Pattern
            if (pattern.pivotIndices && pattern.pivotPoints) {
              const { candleIndex, pivotIndices, pivotPoints, doubleType, ratio } = pattern;
              
              // Debug log
              console.log('Double pattern data:', {
                candleIndex,
                pivotIndices,
                pivotPoints,
                doubleType,
                ratio,
                originalDataLength: originalData.length
              });
              
              // Tạo markers cho các pivot points
              pivotIndices.forEach((pivotIdx, i) => {
                if (pivotIdx >= 0 && pivotIdx < originalData.length) {
                  const candleData = originalData[pivotIdx];
                  if (candleData && pivotPoints[i]) {
                    const isTop = doubleType === 'tops' || doubleType === 'both';
                    
                    allMarkers.push({
                      time: candleData.time,
                      position: isTop ? 'aboveBar' : 'belowBar',
                      color: doubleType === 'tops' ? '#FF4444' : '#44FF44',
                      shape: 'circle',
                      text: `P${i + 1}: ${pivotPoints[i].toFixed(2)}`,
                      size: 1.5
                    });
                  }
                } else {
                  console.warn(`Invalid pivotIndices[${i}]: ${pivotIdx}, originalData length: ${originalData.length}`);
                }
              });

              // Vẽ đường nối các pivot points - chỉ sử dụng index hợp lệ
              const lineData = pivotIndices.map((pivotIdx, i) => {
                if (pivotIdx >= 0 && pivotIdx < originalData.length && pivotPoints[i]) {
                  const candleData = originalData[pivotIdx];
                  return candleData ? {
                    time: candleData.time,
                    value: pivotPoints[i]
                  } : null;
                }
                return null;
              }).filter(point => point !== null);

              if (lineData.length > 1) {
                const lineColor = doubleType === 'tops' ? 'rgba(255, 68, 68, 0.8)' : 'rgba(68, 255, 68, 0.8)';
                const patternLine = chart.addLineSeries({
                  color: lineColor,
                  lineWidth: 2,
                  lineStyle: 2, // Dashed line
                  crosshairMarkerVisible: false,
                  lastValueVisible: false,
                  priceLineVisible: false,
                });
                patternLine.setData(lineData);
                allLines.push(patternLine);
              }

              // Thêm marker chính cho pattern với abbreviation
              if (candleIndex >= 0 && candleIndex < originalData.length) {
                const mainCandle = originalData[candleIndex];
                if (mainCandle) {
                  allMarkers.push({
                    time: mainCandle.time,
                    position: doubleType === 'tops' ? 'aboveBar' : 'belowBar',
                    color: doubleType === 'tops' ? '#ef5350' : '#26a69a',
                    shape: 'circle',

                        time: candleData.time,

                        text: `L${i + 1}: ${flagLows[i].toFixed(2)}`,

                    console.warn(`Invalid flagLowsIdx[${i}]: ${idx}, originalData length: ${originalData.length}`);

                // Vẽ đường lower trendline - chỉ sử dụng index hợp lệ
                const lowerLineData = flagLowsIdx.map((idx, i) => {
                  if (idx >= 0 && idx < originalData.length && flagLows[i]) {
                    const candleData = originalData[idx];
                    return candleData ? {
                      time: candleData.time,
                      value: flagLows[i]
                    } : null;
                  }
                  return null;
                }).filter(point => point !== null);

                if (lowerLineData.length > 1) { // Cần ít nhất 2 điểm để vẽ đường
                  const lowerLine = chart.addLineSeries({
                    color: 'rgba(0, 206, 209, 0.8)',
                    lineWidth: 2,
                    crosshairMarkerVisible: false,
                    lastValueVisible: false,
                    priceLineVisible: false,
                  });
                  lowerLine.setData(lowerLineData);
                  allLines.push(lowerLine);
                }
              }

              // Main marker cho flag pattern với abbreviation
              if (candleIndex >= 0 && candleIndex < originalData.length) {
                const mainCandle = originalData[candleIndex];
                if (mainCandle) {
                  allMarkers.push({
                    time: mainCandle.time,
                    position: direction === 'bullish' ? 'belowBar' : 'aboveBar',
                    color: direction === 'bullish' ? '#26a69a' : '#ef5350',
                    shape: 'circle',
                    text: abbreviation,
                    size: 1.5
                  });

              } else {
                console.warn(`Invalid candleIndex: ${candleIndex}, originalData length: ${originalData.length}`);
              }

            // Xử lý cho Head and Shoulders patterns
            else if (pattern.headIndex !== undefined && pattern.leftShoulderIndex !== undefined && pattern.rightShoulderIndex !== undefined) {
              const { candleIndex, headIndex, leftShoulderIndex, rightShoulderIndex, headPrice, leftShoulderPrice, rightShoulderPrice, necklinePrice, patternType } = pattern;

                    allMarkers.push({
                      time: candleData.time,
                      position: patternType === 'inverse' ? 'belowBar' : 'aboveBar',
                      color: point.color,
                      shape: 'circle',
                      text: `${point.label}: ${point.price.toFixed(2)}`,
                      size: 1.5
                    });
                  }
                }
              });

              // Vẽ neckline nếu có
              if (necklinePrice && leftShoulderIndex >= 0 && rightShoulderIndex >= 0) {
                const necklineData = [
                  { time: originalData[leftShoulderIndex].time, value: necklinePrice },
                  { time: originalData[rightShoulderIndex].time, value: necklinePrice }
                ];
                
                const neckline = chart.addLineSeries({
                  color: 'rgba(255, 255, 0, 0.8)',
                  lineWidth: 2,
                  lineStyle: 1, // Solid line
                  crosshairMarkerVisible: false,
                  lastValueVisible: false,
                  priceLineVisible: false,
                });
                neckline.setData(necklineData);
                allLines.push(neckline);
              }

              // Main marker với abbreviation
              if (candleIndex >= 0 && candleIndex < originalData.length) {
                const mainCandle = originalData[candleIndex];
                if (mainCandle) {
                  allMarkers.push({
                    time: mainCandle.time,
                    position: patternType === 'inverse' ? 'belowBar' : 'aboveBar',
                    color: patternType === 'inverse' ? '#26a69a' : '#ef5350',
                    shape: 'circle',
                    text: abbreviation,
                    size: 1.5
                  });
                }
              }
            }

            // Xử lý cho Pennant patterns
            else if (pattern.pennantHighs && pattern.pennantLows) {
              const { candleIndex, pennantHighsIdx, pennantLowsIdx, pennantHighs, pennantLows, direction } = pattern;
              
              console.log('Pennant pattern data:', {
                candleIndex, pennantHighsIdx, pennantLowsIdx,
                pennantHighs, pennantLows, direction
              });

              // Markers cho pennant highs
              if (pennantHighsIdx && pennantHighs) {
                pennantHighsIdx.forEach((idx, i) => {
                  if (idx >= 0 && idx < originalData.length && pennantHighs[i]) {
                    const candleData = originalData[idx];
                    if (candleData) {
                      allMarkers.push({
                        time: candleData.time,
                        position: 'aboveBar',
                        color: '#FF6B35',
                        shape: 'circle',
                        text: `PH${i + 1}: ${pennantHighs[i].toFixed(2)}`,
                        size: 1
                      });
                    }
                  }
                });

                // Vẽ upper trendline
                const upperLineData = pennantHighsIdx.map((idx, i) => {
                  if (idx >= 0 && idx < originalData.length && pennantHighs[i]) {
                    return { time: originalData[idx].time, value: pennantHighs[i] };
                  }
                  return null;
                }).filter(point => point !== null);

                if (upperLineData.length > 1) {
                  const upperLine = chart.addLineSeries({
                    color: 'rgba(255, 107, 53, 0.8)',
                    lineWidth: 2,
                    crosshairMarkerVisible: false,
                    lastValueVisible: false,
                    priceLineVisible: false,
                  });
                  upperLine.setData(upperLineData);
                  allLines.push(upperLine);
                }
              }

              // Markers cho pennant lows
              if (pennantLowsIdx && pennantLows) {
                pennantLowsIdx.forEach((idx, i) => {
                  if (idx >= 0 && idx < originalData.length && pennantLows[i]) {
                    const candleData = originalData[idx];
                    if (candleData) {
                      allMarkers.push({
                        time: candleData.time,
                        position: 'belowBar',
                        color: '#4ECDC4',
                        shape: 'circle',
                        text: `PL${i + 1}: ${pennantLows[i].toFixed(2)}`,
                        size: 1
                      });
                    }
                  }
                });

                // Vẽ lower trendline
                const lowerLineData = pennantLowsIdx.map((idx, i) => {
                  if (idx >= 0 && idx < originalData.length && pennantLows[i]) {
                    return { time: originalData[idx].time, value: pennantLows[i] };
                  }
                  return null;
                }).filter(point => point !== null);

                if (lowerLineData.length > 1) {
                  const lowerLine = chart.addLineSeries({
                    color: 'rgba(78, 205, 196, 0.8)',
                    lineWidth: 2,
                    crosshairMarkerVisible: false,
                    lastValueVisible: false,
                    priceLineVisible: false,
                  });
                  lowerLine.setData(lowerLineData);
                  allLines.push(lowerLine);
                }
              }

              // Main marker cho pennant với abbreviation
              if (candleIndex >= 0 && candleIndex < originalData.length) {
                const mainCandle = originalData[candleIndex];
                if (mainCandle) {
                  allMarkers.push({
                    time: mainCandle.time,
                    position: direction === 'bullish' ? 'belowBar' : 'aboveBar',
                    color: direction === 'bullish' ? '#26a69a' : '#ef5350',
                    shape: 'circle',
                    text: abbreviation,
                    size: 1.5
                  });
                }
              }
            }

            // Xử lý cho Triangle patterns
            else if (pattern.triangleType || (pattern.upperTrendIndices && pattern.lowerTrendIndices)) {
              const { candleIndex, triangleType, upperTrendIndices, lowerTrendIndices, upperTrendValues, lowerTrendValues, direction } = pattern;
              
              console.log('Triangle pattern data:', {
                candleIndex, triangleType, upperTrendIndices, lowerTrendIndices,
                upperTrendValues, lowerTrendValues, direction
              });

              // Màu sắc theo loại triangle
              const colors = {
                'ascending': { upper: '#32CD32', lower: '#32CD32', main: '#00FF00' },
                'descending': { upper: '#FF6347', lower: '#FF6347', main: '#FF0000' },
                'symmetrical': { upper: '#FFD700', lower: '#FFD700', main: '#FFA500' }
              };
              const color = colors[triangleType] || colors['symmetrical'];

              // Markers cho upper trend
              if (upperTrendIndices && upperTrendValues) {
                upperTrendIndices.forEach((idx, i) => {
                  if (idx >= 0 && idx < originalData.length && upperTrendValues[i]) {
                    const candleData = originalData[idx];
                    if (candleData) {
                      allMarkers.push({
                        time: candleData.time,
                        position: 'aboveBar',
                        color: color.upper,
                        shape: 'circle',
                        text: `U${i + 1}: ${upperTrendValues[i].toFixed(2)}`,
                        size: 1
                      });
                    }
                  }
                });

                // Vẽ upper trendline
                const upperLineData = upperTrendIndices.map((idx, i) => {
                  if (idx >= 0 && idx < originalData.length && upperTrendValues[i]) {
                    return { time: originalData[idx].time, value: upperTrendValues[i] };
                  }
                  return null;
                }).filter(point => point !== null);

                if (upperLineData.length > 1) {
                  const upperLine = chart.addLineSeries({
                    color: color.upper + '80',
                    lineWidth: 2,
                    crosshairMarkerVisible: false,
                    lastValueVisible: false,
                    priceLineVisible: false,
                  });
                  upperLine.setData(upperLineData);
                  allLines.push(upperLine);
                }
              }

              // Markers cho lower trend
              if (lowerTrendIndices && lowerTrendValues) {
                lowerTrendIndices.forEach((idx, i) => {
                  if (idx >= 0 && idx < originalData.length && lowerTrendValues[i]) {
                    const candleData = originalData[idx];
                    if (candleData) {
                      allMarkers.push({
                        time: candleData.time,
                        position: 'belowBar',
                        color: color.lower,
                        shape: 'circle',
                        text: `L${i + 1}: ${lowerTrendValues[i].toFixed(2)}`,
                        size: 1
                      });
                    }
                  }
                });

                // Vẽ lower trendline
                const lowerLineData = lowerTrendIndices.map((idx, i) => {
                  if (idx >= 0 && idx < originalData.length && lowerTrendValues[i]) {
                    return { time: originalData[idx].time, value: lowerTrendValues[i] };
                  }
                  return null;
                }).filter(point => point !== null);

                if (lowerLineData.length > 1) {
                  const lowerLine = chart.addLineSeries({
                    color: color.lower + '80',
                    lineWidth: 2,
                    crosshairMarkerVisible: false,
                    lastValueVisible: false,
                    priceLineVisible: false,
                  });
                  lowerLine.setData(lowerLineData);
                  allLines.push(lowerLine);
                }
              }

              // Main marker cho triangle với abbreviation
              if (candleIndex >= 0 && candleIndex < originalData.length) {
                const mainCandle = originalData[candleIndex];
                if (mainCandle) {
                  const triSentiment = triangleType === 'ascending' ? 'bullish' : 
                                       triangleType === 'descending' ? 'bearish' : 'neutral';
                  allMarkers.push({
                    time: mainCandle.time,
                    position: triSentiment === 'bearish' ? 'aboveBar' : 'belowBar',
                    color: triSentiment === 'bullish' ? '#26a69a' : 
                           triSentiment === 'bearish' ? '#ef5350' : '#9933FF',
                    shape: 'circle',
                    text: abbreviation,
                    size: 1.5
                  });
                }
              }
            }

            // Xử lý cho các patterns khác (fallback)
            else {
              console.log('Generic pattern processing for:', patternTitle);
              if (pattern.candleIndex !== undefined && pattern.candleIndex >= 0 && pattern.candleIndex < originalData.length) {
                const mainCandle = originalData[pattern.candleIndex];
                if (mainCandle) {
                  allMarkers.push({
                    time: mainCandle.time,
                    position: 'aboveBar',
                    color: '#9933FF',
                    shape: 'circle',
                    text: patternTitle,
                    size: 2
                  });
                }
              }
            }
          });

          // Cập nhật markers
          if (allMarkers.length > 0) {
            candleseries.setMarkers(allMarkers);
            
            // Setup tooltip for complex patterns
            setupMarkerTooltips(patterns, patternName, patternTitle);
            
            console.log(`Found ${patterns.length} ${patternTitle} pattern(s)`);
            setStatus(`Tìm thấy ${patterns.length} mô hình ${patternTitle}.`);
          } else {
            console.log('No patterns to display');
            setStatus('Không có mô hình để hiển thị.');
          }

          // Lưu các line series để có thể xóa sau
          if (!window.patternLines) {
            window.patternLines = [];
          }
          window.patternLines.push(...allLines);

        } catch (error) {
          console.error('Error processing complex pattern:', error.message);
          setStatus('Lỗi: ' + error.message);
        }
      }

      const resetPatterns = () => {
        try {
          setStatus('Đang reset mô hình...');
          
          if (!candleseries) {
            console.error('Candleseries is not initialized.');
            return;
          }

          // Xóa các line series đã vẽ trước đó
          if (window.patternLines && window.patternLines.length > 0) {
            window.patternLines.forEach(line => {
              try {
                chart.removeSeries(line);
              } catch (e) {
                console.warn('Could not remove line series:', e);
              }
            });
            window.patternLines = [];
          }

          // Reset markers
          candleseries.setMarkers([]);

          // Đảm bảo dữ liệu gốc được hiển thị
          if (isValidData(originalData)) {
            candleseries.setData([...originalData]); // Tạo copy để tránh thay đổi originalData
          }
          
          setStatus('Sẵn sàng.');

        } catch (error) {
          console.error('Error in resetPatterns:', error.message);
          setStatus('Lỗi: ' + error.message);
        }
      };


      // Gọi hàm displayChart từ sự kiện tải trang hoặc khi dữ liệu đã sẵn sàng.
      // window.addEventListener('DOMContentLoaded', displayChart);

      displayChart();
    </script>
  </body>
  </html>
