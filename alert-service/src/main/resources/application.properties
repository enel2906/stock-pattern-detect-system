spring.application.name=alert
server.port=60
spring.data.mongodb.uri=mongodb://localhost:27017/candlestick_db

# JWT Configuration
jwt.secret=50c95ffa6f7b01a935470db9dc798325
jwt.expiration=9000000
jwt.refresh-expiration=604800000

# Google OAuth2
spring.security.oauth2.client.registration.google.scope=profile,email
spring.security.oauth2.client.registration.google.redirect-uri={baseUrl}/login/oauth2/code/google
spring.security.oauth2.client.registration.google.client-id=
spring.security.oauth2.client.registration.google.client-secret=

# RabbitMQ Configuration
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest
# Auto-recovery configuration - tự động kết nối lại khi RabbitMQ restart
spring.rabbitmq.connection-timeout=15000
spring.rabbitmq.requested-heartbeat=30
spring.rabbitmq.listener.simple.retry.enabled=true
spring.rabbitmq.listener.simple.retry.initial-interval=3000
spring.rabbitmq.listener.simple.retry.max-attempts=5
spring.rabbitmq.listener.simple.retry.max-interval=10000
spring.rabbitmq.listener.simple.retry.multiplier=2.0

# CORS - Allow localhost and ALL LAN access
# Use * to allow all origins (for development/LAN access)
cors.allowed-origins=*