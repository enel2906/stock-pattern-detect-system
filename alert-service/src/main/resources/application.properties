spring.application.name=alert
server.port=60
spring.data.mongodb.uri=mongodb://localhost:27017/candlestick_db

# JWT Configuration
jwt.secret=your-secret-key-change-this-in-production-min-256-bits-long
jwt.expiration=900000
jwt.refresh-expiration=604800000

# Google OAuth2
spring.security.oauth2.client.registration.google.scope=profile,email
spring.security.oauth2.client.registration.google.redirect-uri=http://localhost:60/login/oauth2/code/google

# RabbitMQ Configuration
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest

# CORS
cors.allowed-origins=http://localhost:5173,http://localhost:3000