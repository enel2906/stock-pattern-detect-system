version: '3.8'

services:
  # Stock Data Service
  stock-service:
    build: .
    ports:
      - "60:60"
    environment:
      - PORT=60
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/stock_db
    depends_on:
      - redis
      - postgres
    restart: unless-stopped
    networks:
      - stock-network

  # Redis Cache (Optional but recommended)
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes
    restart: unless-stopped
    networks:
      - stock-network

  # PostgreSQL Database (Optional)
  postgres:
    image: postgres:15-alpine
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=stock_db
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    restart: unless-stopped
    networks:
      - stock-network

volumes:
  redis-data:
  postgres-data:

networks:
  stock-network:
    driver: bridge
